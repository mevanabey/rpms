# Keep dependency files out of iCloud Drive under ~/Documents. pnpm 11
# reads this setting here, not in .npmrc. Stay inside the project so
# Turbopack can compile the packages.
virtualStoreDir: .pnpm.nosync

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
